name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Qt scale ${{ matrix.qt_scale }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        qt_scale: ["1", "1.5", "2"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-lock.txt
      - name: Install exact dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify dependency environment
        run: python -m pip check
      - name: Audit dependency vulnerabilities
        run: python -X utf8 -m pip_audit --strict --disable-pip -r requirements-lock.txt
      - name: Run release and privacy static checks
        run: python -m unittest discover -s tests -p test_release_v130.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run UI smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: ${{ matrix.qt_scale }}
        run: python scripts/smoke_ui_qt.py

  package:
    name: Clean onefile package
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-lock.txt
      - name: Install exact dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify dependency environment
        run: python -m pip check
      - name: Clean onefile build
        shell: pwsh
        run: .\scripts\build_windows.ps1 -OneFile
      - name: Validate packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.3.0"
          $expectedSchemaVersion = "7"
          $asset = Join-Path $PWD "dist\PCStat.exe"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing onefile artifact: $asset"
          }
          $versionInfo = (Get-Item -LiteralPath $asset).VersionInfo
          if ($versionInfo.FileVersion -ne $version) {
              throw "FileVersion '$($versionInfo.FileVersion)' does not match $version"
          }
          if ($versionInfo.ProductVersion -ne $version) {
              throw "ProductVersion '$($versionInfo.ProductVersion)' does not match $version"
          }

          $smokeDir = Join-Path ([System.IO.Path]::GetTempPath()) ("pcstat_ci_" + [guid]::NewGuid().ToString("N"))
          $smokeDb = Join-Path $smokeDir "data.sqlite"
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          try {
              $env:PCSTAT_DB_PATH = $smokeDb
              $env:QT_QPA_PLATFORM = "offscreen"
              $process = Start-Process -FilePath $asset -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                  throw "Packaged smoke failed with exit code $($process.ExitCode)"
              }
              if (-not (Test-Path -LiteralPath $smokeDb -PathType Leaf)) {
                  throw "Packaged smoke did not create the redirected database"
              }
              $checkScript = "import sqlite3,sys;db=sqlite3.connect(sys.argv[1]);schema=db.execute(sys.argv[2]).fetchone();quick=db.execute(sys.argv[3]).fetchone();db.close();print((schema or [chr(0)])[0]+chr(124)+(quick or [chr(0)])[0])"
              $dbCheck = (& python -c $checkScript $smokeDb "SELECT value FROM meta WHERE key='schema_version'" "PRAGMA quick_check" | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or $dbCheck -ne "$expectedSchemaVersion|ok") {
                  throw "SQLite validation failed: expected $expectedSchemaVersion|ok, got $dbCheck"
              }
          } finally {
              Remove-Item Env:PCSTAT_DB_PATH -ErrorAction SilentlyContinue
              Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $smokeDir) {
                  Remove-Item -LiteralPath $smokeDir -Recurse -Force
              }
          }
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath dist\PCStat.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath dist\SHA256SUMS.txt -Value "$hash  PCStat.exe" -Encoding ascii
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: PCStat-1.3.0-windows-x64
          path: |
            dist/PCStat.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
